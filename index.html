<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Steganography Vault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    color:white;
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:40px;
    font-size:42px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:20px;
    padding:25px;
}

.card h2{
    margin-bottom:20px;
    font-size:28px;
}

input{
    width:100%;
    margin-bottom:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#21262d;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#238636;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.9;
}

.status{
    margin-top:15px;
    color:#8b949e;
    line-height:1.5;
    word-break:break-word;
}

.info{
    margin-top:10px;
    font-size:13px;
    color:#6e7681;
}

canvas{
    display:none;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>Secure Steganography Vault</h1>

<div class="grid">

<!-- EMBED -->

<div class="card">

<h2>Embed Hidden Image</h2>

<input type="file" id="coverImage" accept="image/*">
<input type="file" id="hiddenImage" accept="image/*">

<input type="password" id="embedPassword" placeholder="Enter Password">

<button id="embedBtn">
Encrypt & Embed Image
</button>

<div class="status" id="embedStatus"></div>

<div class="info">
Encoded image will always download as PNG for reliability.
</div>

</div>

<!-- EXTRACT -->

<div class="card">

<h2>Extract Hidden Image</h2>

<input type="file" id="encodedImage" accept="image/*">

<input type="password" id="extractPassword" placeholder="Enter Password">

<button id="extractBtn">
Extract Hidden Image
</button>

<div class="status" id="extractStatus"></div>

</div>

</div>

<canvas id="canvas"></canvas>

</div>

<script>

const MAGIC = "STEGO_SECURE_V2";

function setStatus(id,msg){
    document.getElementById(id).innerText = msg;
}

function bytesToBits(bytes){

    const bits = [];

    for(let byte of bytes){

        for(let i=7;i>=0;i--){

            bits.push((byte >> i) & 1);

        }

    }

    return bits;
}

function bitsToBytes(bits){

    const bytes = [];

    for(let i=0;i<bits.length;i+=8){

        let byte = 0;

        for(let j=0;j<8;j++){

            byte = (byte << 1) | bits[i+j];

        }

        bytes.push(byte);

    }

    return new Uint8Array(bytes);
}

async function loadImage(file){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.onload = ()=>resolve(img);

        img.onerror = reject;

        img.src = URL.createObjectURL(file);

    });

}

async function deriveKey(password,salt){

    const encoder = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        {name:"PBKDF2"},
        false,
        ["deriveKey"]
    );

    return await crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:150000,
            hash:"SHA-256"
        },
        keyMaterial,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt","decrypt"]
    );

}

async function encryptData(buffer,password){

    const salt = crypto.getRandomValues(new Uint8Array(16));

    const iv = crypto.getRandomValues(new Uint8Array(12));

    const key = await deriveKey(password,salt);

    const encrypted = await crypto.subtle.encrypt(
        {
            name:"AES-GCM",
            iv:iv
        },
        key,
        buffer
    );

    return {
        encrypted:new Uint8Array(encrypted),
        salt,
        iv
    };

}

async function decryptData(encrypted,password,salt,iv){

    const key = await deriveKey(password,salt);

    return await crypto.subtle.decrypt(
        {
            name:"AES-GCM",
            iv:iv
        },
        key,
        encrypted
    );

}

document.getElementById("embedBtn").onclick = async ()=>{

    try{

        const coverFile =
            document.getElementById("coverImage").files[0];

        const hiddenFile =
            document.getElementById("hiddenImage").files[0];

        const password =
            document.getElementById("embedPassword").value;

        if(!coverFile || !hiddenFile || !password){

            setStatus(
                "embedStatus",
                "Please fill all fields."
            );

            return;
        }

        setStatus(
            "embedStatus",
            "Reading hidden image..."
        );

        const hiddenBuffer =
            await hiddenFile.arrayBuffer();

        setStatus(
            "embedStatus",
            "Encrypting hidden image..."
        );

        const encryptedObj =
            await encryptData(hiddenBuffer,password);

        const payload = {

            magic:MAGIC,

            filename:hiddenFile.name,

            mime:hiddenFile.type,

            salt:Array.from(encryptedObj.salt),

            iv:Array.from(encryptedObj.iv),

            data:Array.from(encryptedObj.encrypted)

        };

        const encoder = new TextEncoder();

        const payloadBytes =
            encoder.encode(JSON.stringify(payload));

        const payloadLength =
            new Uint32Array([payloadBytes.length]);

        const lengthBytes =
            new Uint8Array(payloadLength.buffer);

        const combined =
            new Uint8Array(
                lengthBytes.length + payloadBytes.length
            );

        combined.set(lengthBytes,0);

        combined.set(payloadBytes,4);

        const bits = bytesToBits(combined);

        setStatus(
            "embedStatus",
            "Preparing base image..."
        );

        const image = await loadImage(coverFile);

        const canvas =
            document.getElementById("canvas");

        const ctx = canvas.getContext("2d");

        canvas.width = image.width;

        canvas.height = image.height;

        ctx.drawImage(image,0,0);

        const imageData =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

        const pixels = imageData.data;

        const usableBits =
            (pixels.length / 4) * 3;

        if(bits.length > usableBits){

            setStatus(
                "embedStatus",
                "Base image too small for hidden image."
            );

            return;
        }

        setStatus(
            "embedStatus",
            "Embedding encrypted data..."
        );

        let bitIndex = 0;

        for(let i=0;i<pixels.length;i++){

            if((i+1)%4===0) continue;

            if(bitIndex < bits.length){

                pixels[i] =
                    (pixels[i] & 0xFE) | bits[bitIndex];

                bitIndex++;

            }

        }

        ctx.putImageData(imageData,0,0);

        setStatus(
            "embedStatus",
            "Generating encoded PNG..."
        );

        canvas.toBlob((blob)=>{

            const a =
                document.createElement("a");

            a.href =
                URL.createObjectURL(blob);

            a.download =
                "encoded-stego-image.png";

            a.click();

            setStatus(
                "embedStatus",
                "Success! Encoded image downloaded."
            );

        },"image/png");

    }catch(error){

        console.error(error);

        setStatus(
            "embedStatus",
            "Embedding failed."
        );

    }

};

document.getElementById("extractBtn").onclick = async ()=>{

    try{

        const file =
            document.getElementById("encodedImage").files[0];

        const password =
            document.getElementById("extractPassword").value;

        if(!file || !password){

            setStatus(
                "extractStatus",
                "Please fill all fields."
            );

            return;
        }

        setStatus(
            "extractStatus",
            "Loading encoded image..."
        );

        const image = await loadImage(file);

        const canvas =
            document.getElementById("canvas");

        const ctx = canvas.getContext("2d");

        canvas.width = image.width;

        canvas.height = image.height;

        ctx.drawImage(image,0,0);

        const imageData =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

        const pixels = imageData.data;

        const bits = [];

        for(let i=0;i<pixels.length;i++){

            if((i+1)%4===0) continue;

            bits.push(pixels[i] & 1);

        }

        const lengthBits =
            bits.slice(0,32);

        const lengthBytes =
            bitsToBytes(lengthBits);

        const payloadLength =
            new Uint32Array(lengthBytes.buffer)[0];

        const payloadBits =
            bits.slice(
                32,
                32 + payloadLength*8
            );

        const payloadBytes =
            bitsToBytes(payloadBits);

        const decoder =
            new TextDecoder();

        const payload =
            JSON.parse(
                decoder.decode(payloadBytes)
            );

        if(payload.magic !== MAGIC){

            setStatus(
                "extractStatus",
                "No hidden data found."
            );

            return;
        }

        setStatus(
            "extractStatus",
            "Decrypting hidden image..."
        );

        const decrypted =
            await decryptData(
                new Uint8Array(payload.data),
                password,
                new Uint8Array(payload.salt),
                new Uint8Array(payload.iv)
            );

        const blob = new Blob(
            [decrypted],
            {
                type:payload.mime
            }
        );

        const a =
            document.createElement("a");

        a.href =
            URL.createObjectURL(blob);

        a.download =
            payload.filename;

        a.click();

        setStatus(
            "extractStatus",
            "Hidden image recovered successfully."
        );

    }catch(error){

        console.error(error);

        setStatus(
            "extractStatus",
            "Wrong password or corrupted image."
        );

    }

};

</script>

</body>
</html>
